<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Space Apps Prep — Mission Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-cream text-ink">

  <div class="max-w-4xl mx-auto px-6 py-14 sm:py-20">

    <!-- Hero -->
    <header class="mb-14">
      <p id="greeting" class="text-muted text-sm mb-2"></p>
      <h1 class="text-5xl sm:text-6xl font-semibold tracking-tight leading-[1.05]">NSAC 2026: Team Calendar & Navigation</h1>
      <p id="projectName" class="text-muted mt-4 text-lg"></p>
    </header>

    <!-- Quick links row -->
    <section class="grid sm:grid-cols-2 gap-4 mb-6">
      <a id="repoCard" href="#" target="_blank" rel="noopener"
         class="group relative bg-amber rounded-3xl p-7 flex flex-col justify-between min-h-[160px] hover:brightness-[0.97] transition">
        <div class="w-9 h-9 rounded-full bg-ink flex items-center justify-center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-cream">
            <path fill="currentColor" d="M12 .3a12 12 0 00-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 016 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0012 .3z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-2xl font-semibold mt-6">Repository</h2>
          <p class="text-ink/60 text-sm mt-1 truncate">Github Repository →</p>
        </div>
      </a>

      <div class="bg-mint rounded-3xl p-7 flex flex-col justify-between min-h-[160px]">
        <div class="w-9 h-9 rounded-full bg-ink flex items-center justify-center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-cream">
            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/>
          </svg>
        </div>
        <div>
          <h2 class="text-2xl font-semibold mt-6">Preparation Timeline</h2>
          <p class="text-ink/60 text-sm mt-1">Live Schedule Below ↓</p>
        </div>
      </div>
    </section>

    <!-- Docs list -->
    <section class="mb-10">
      <h2 class="text-lg font-semibold mb-4 mt-10">Documents & References</h2>
      <div id="docsList" class="rounded-3xl overflow-hidden border border-ink/10 divide-y divide-ink/10 bg-white/60"></div>
    </section>

    <!-- Calendar -->
    <section class="mb-6">
      <h2 class="text-lg font-semibold mb-4">Team calendar</h2>
      <div class="rounded-3xl overflow-hidden border border-ink/10 bg-white/60 p-2">
        <iframe id="calFrame" style="border:0" width="100%" height="600" frameborder="0" scrolling="no"></iframe>
      </div>
    </section>

    <footer class="text-center text-muted text-xs pt-10 pb-4">
      NASA Space Apps Challenge 2026. Team Calendar & Navigation.
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
